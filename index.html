<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GPS Táctico de Campo - Syntro</title>
  
  <!-- Leaflet CSS y JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: sans-serif; overflow: hidden; }
    #map { height: 100vh; width: 100vw; }
    
    /* Panel de Control Flotante */
    .controls-panel {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 18px;
      border-radius: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      border: none;
      padding: 12px 16px;
      border-radius: 18px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      color: white;
    }

    .btn-punto { background: #2e7d32; }
    .btn-track { background: #e65100; }
    .btn-stop { background: #c62828; }
    .btn-export { background: #1565c0; }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Botones de Acción -->
  <div class="controls-panel">
    <button class="btn-punto" onclick="marcarPuntoGPS()">📍 Marcar Punto</button>
    <button class="btn-track" id="btnTrack" onclick="toggleTracking()">🟢 Iniciar Polígono</button>
    <button class="btn-export" onclick="exportarGeoJSON()">📥 GeoJSON</button>
  </div>

  <script>
    // 1. Inicializar Mapa (Vista preliminar)
    const map = L.map('map', {zoomControl: false}).setView([10.0, -71.5], 17);

    // Control de zoom a la derecha para comodidad móvil
    L.control.zoom({position: 'topright'}).addTo(map);

    // Capa Satelital de Google
    const googleSat = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
      maxZoom: 21,
      maxNativeZoom: 20,
      attribution: 'Google Satélite'
    }).addTo(map);

    const drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);

    let trackingActive = false;
    let currentPolygonCoords = [];
    let trackingLine = null;
    let userMarker = null;
    let firstFix = true;

    // 2. Activar geolocalización en tiempo real con alta frecuencia (WatchPosition nativo)
    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        function(position) {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const latlng = [lat, lng];

          // Actualizar o crear el marcador azul en la posición exacta
          if (userMarker) {
            userMarker.setLatLng(latlng);
          } else {
            userMarker = L.circleMarker(latlng, {
              radius: 10,
              fillColor: "#2196F3",
              color: "#ffffff",
              weight: 3,
              fillOpacity: 1
            }).addTo(map);
          }

          // **EL TRUCO CLAVE**: Forzar al mapa a centrarse automáticamente en ti al moverte
          if (firstFix || trackingActive) {
            map.setView(latlng, 18); // Ajusta el zoom de seguimiento automático
            firstFix = false;
          }

          // Si estás grabando el polígono caminando, agregar coordenada en tiempo real
          if (trackingActive) {
            currentPolygonCoords.push(latlng);
            if (trackingLine) {
              map.removeLayer(trackingLine);
            }
            trackingLine = L.polygon(currentPolygonCoords, {
              color: '#ff9800', 
              weight: 4, 
              fillColor: '#ff9800', 
              fillOpacity: 0.3
            }).addTo(map);
          }
        },
        function(error) {
          console.warn("Error de GPS: " + error.message);
        },
        {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 10000
        }
      );
    } else {
      alert("Tu navegador no soporta geolocalización GPS.");
    }

    // 3. Registrar un Punto exacto
    function marcarPuntoGPS() {
      if (userMarker) {
        const latlng = userMarker.getLatLng();
        const marker = L.marker(latlng).bindPopup("Punto GPS Registrado").addTo(drawnItems);
        marker.openPopup();
        alert("¡Punto guardado con éxito!");
      } else {
        alert("Buscando señal de satélite GPS... espera un momento.");
      }
    }

    // 4. Iniciar / Detener el Polígono por recorrido
    function toggleTracking() {
      const btn = document.getElementById('btnTrack');
      if (!trackingActive) {
        trackingActive = true;
        currentPolygonCoords = [];
        btn.innerText = "🛑 Guardar Polígono";
        btn.className = "btn-stop";
        alert("Modo Polígono activado. Camina por el perímetro del terreno.");
      } else {
        trackingActive = false;
        btn.innerText = "🟢 Iniciar Polígono";
        btn.className = "btn-track";
        
        if (currentPolygonCoords.length > 2) {
          const finishedPolygon = L.polygon(currentPolygonCoords, {
            color: '#2e7d32', 
            weight: 4, 
            fillColor: '#4CAF50', 
            fillOpacity: 0.4
          }).addTo(drawnItems);
          
          alert("¡Polígono cerrado y guardado correctamente!");
        } else {
          alert("No se recorrió suficiente distancia para formar un polígono.");
        }
      }
    }

    // 5. Descargar datos en GeoJSON
    function exportarGeoJSON() {
      const data = drawnItems.toGeoJSON();
      if (data.features.length === 0) {
        alert("No hay elementos guardados todavía.");
        return;
      }
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "levantamiento_syntro.geojson");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }
  </script>
</body>
</html>
